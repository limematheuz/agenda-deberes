<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>CalendarAppio — Calendario, horario y tareas</title>

  <!-- SEO & Metadatos -->
  <meta name="description" content="Organiza tu día a día con CalendarAppio: calendario mensual y semanal, cuadrícula de horario escolar y laboral de 08:00 a 18:00, centro de avisos y bloc de notas sincronizados en la nube.">
  <meta name="author" content="Matheus Lima">

  <!-- Open Graph / WhatsApp / Telegram / iMessage / Redes Sociales -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CalendarAppio">
  <meta property="og:title" content="CalendarAppio — Calendario, horario semanal y tareas">
  <meta property="og:description" content="Tu agenda inteligente: calendario interactivo, cuadrícula de horario de 08:00 a 18:00, recordatorios y bloc de notas sincronizados en un solo lugar.">
  <meta property="og:image" content="/brand/calendarappio-share.png">
  <meta property="og:image:secure_url" content="/brand/calendarappio-share.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo y tarjeta de presentación de CalendarAppio">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CalendarAppio — Calendario, horario semanal y tareas">
  <meta name="twitter:description" content="Tu agenda inteligente: calendario interactivo, cuadrícula de horario de 08:00 a 18:00, recordatorios y bloc de notas sincronizados.">
  <meta name="twitter:image" content="/brand/calendarappio-share.png">

  <script>
    (function() {
      try {
        var base = window.location.origin;
        var ogImg = document.querySelector('meta[property="og:image"]');
        var ogSec = document.querySelector('meta[property="og:image:secure_url"]');
        var twImg = document.querySelector('meta[name="twitter:image"]');
        if (ogImg && ogImg.content && !ogImg.content.startsWith('http')) ogImg.content = base + ogImg.getAttribute('content');
        if (ogSec && ogSec.content && !ogSec.content.startsWith('http')) ogSec.content = base + ogSec.getAttribute('content');
        if (twImg && twImg.content && !twImg.content.startsWith('http')) twImg.content = base + twImg.getAttribute('content');
      } catch (e) {}
    })();
  </script>

  <!-- Iconos y PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3">
  <link rel="icon" type="image/svg+xml" href="/brand/calendarappio-logo.svg?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CalendarAppio">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
